[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cam-laya-cli"
version = "0.1.0"
description = "CLI-first local typed decisions for shell-capable coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
mlx = ["laya-mlx==0.3.0"]
benchmark = ["mcp==2.3.0"]
dev = ["build>=1", "ruff>=0.12"]

[project.scripts]
cam-laya-cli = "cam_laya_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cam_laya_cli"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
